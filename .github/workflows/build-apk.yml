name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Siapkan proyek
        run: |
          echo "Isi repository:"
          find . -not -path './.git/*' -type f | head -50
          IDX=$(find . -name index.html -not -path './.git/*' | head -n1)
          if [ -z "$IDX" ]; then echo "index.html TIDAK ditemukan di repository"; exit 1; fi
          SRC=$(dirname "$IDX")
          echo "Sumber web: $SRC"
          mkdir -p app/www
          for f in index.html manifest.json sw.js icon-192.png icon-512.png; do
            if [ -f "$SRC/$f" ]; then cp "$SRC/$f" app/www/; fi
          done
          cat > app/package.json <<'EOF'
          {
            "name": "petaluring",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/cli": "^6.1.0",
              "@capacitor/core": "^6.1.0"
            }
          }
          EOF
          cat > app/capacitor.config.json <<'EOF'
          {
            "appId": "id.petaluring.app",
            "appName": "PetaLuring",
            "webDir": "www"
          }
          EOF
      - name: Install
        working-directory: app
        run: npm install
      - name: Tambah Android
        working-directory: app
        run: npx cap add android
      - name: Tambah izin lokasi
        working-directory: app
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Sync
        working-directory: app
        run: npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PetaLuring-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
